# Values for the `external-secrets/external-secrets` chart 2.11.0, rendered by
# k8s/argocd/apps/external-secrets.yaml.

installCRDs: true

serviceAccount:
  create: true
  # Fixed name: the Azure Workload Identity federated credential (added with Key Vault) binds to
  # external-secrets/external-secrets. Future SecretStore resources can use this ambient identity
  # without providing credentials of their own.
  name: external-secrets

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
