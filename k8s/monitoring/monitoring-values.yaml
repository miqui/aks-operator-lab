# Values for the `prometheus-community/kube-prometheus-stack` chart 92.9.0, rendered by
# k8s/argocd/apps/monitoring.yaml.
#
# Scope: monitor the cluster itself (nodes, kubelet/cAdvisor, API server, CoreDNS, kube-state-
# metrics, node-exporter) and nothing else. No application metrics, no logs, no traces.
#
# Short-lived dev cluster, so nothing is persisted: Prometheus and Grafana keep their data on
# emptyDir and start fresh with every cluster. No PVCs.
#
# Access is port-forward only (aks-port-forward.sh): no Ingress, no LoadBalancer. Grafana's admin
# password is generated by the chart into a Secret; nothing secret is committed:
#   kubectl -n monitoring get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d; echo

# Short, stable Service names: kps-prometheus (9090) and grafana (80).
fullnameOverride: kps

# No notification receivers are configured, so Alertmanager would only add a pod. Rules still
# evaluate and are visible in Prometheus and Grafana.
alertmanager:
  enabled: false

# AKS runs the control plane outside the cluster: etcd, the scheduler and the controller manager
# can't be scraped, and with the Cilium dataplane there is no kube-proxy. Turn off their scrape
# targets and the alert rules that would fire on the missing targets.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeControllerManager: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    retention: 24h
    scrapeInterval: 30s
    # Only ServiceMonitors/PodMonitors/rules belonging to this release are selected (chart
    # default): the cluster's own components, not whatever an experiment installs.
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        memory: 1536Mi

grafana:
  fullnameOverride: grafana
  # Generated by the chart into the `grafana` Secret when unset.
  persistence:
    enabled: false
  defaultDashboardsTimezone: utc
  service:
    type: ClusterIP
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 384Mi

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi
